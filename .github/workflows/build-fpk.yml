name: build-fpk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  # 版本一致性：打 tag 时必须与 VERSION 相同，否则不发布
  check-tag:
    needs: meta
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 校验 tag 与 VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ needs.meta.outputs.version }}"
          echo "tag=$TAG VERSION=$VER"
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG 与 VERSION $VER 不一致"; exit 1; }

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建 ${{ matrix.arch }} 包
        run: |
          python3 scripts/build_fpk.py \
            --src . \
            --pkg fnos \
            --out dist \
            --version "${{ needs.meta.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --tag "${{ github.ref_type == 'tag' && github.ref_name || 'main' }}" \
            --sha "${GITHUB_SHA}"

      - name: 校验产物
        run: |
          set -e
          ls -l dist
          # 外壳必须是 gzip tar，且带 manifest.checksum
          for f in dist/*.fpk; do
            tar -tzf "$f" | grep -qx 'manifest.checksum' || { echo "::error::$f 缺 manifest.checksum"; exit 1; }
            tar -tzf "$f" | grep -qx 'app.tgz' || { echo "::error::$f 缺 app.tgz"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/*.fpk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  # 发布后自检：确认 release 资产可下载（内部更新走的就是这条链路）
  verify-release:
    needs: [build, meta]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 校验 release 与源码包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" -o rel.json
          python3 - <<'PY'
          import json
          d = json.load(open("rel.json"))
          names = [a["name"] for a in d.get("assets", [])]
          print("assets:", names)
          assert any(n.endswith(".fpk") for n in names), "release 没有 fpk 资产"
          PY
          echo "源码包：$API/tarball/$TAG （内部更新下载这个）"
