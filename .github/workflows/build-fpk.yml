name: build-fpk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 打 tag 时版本必须与 VERSION 一致，否则不进入构建（避免发出错版本）
      - name: 校验 tag 与 VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ needs.meta.outputs.version }}"
          echo "tag=$TAG VERSION=$VER"
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG 与 VERSION $VER 不一致"; exit 1; }

      - name: 构建 ${{ matrix.arch }} 包
        run: |
          python3 scripts/build_fpk.py \
            --src . \
            --pkg fnos \
            --out dist \
            --version "${{ needs.meta.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --tag "${{ github.ref_type == 'tag' && github.ref_name || 'main' }}" \
            --sha "${GITHUB_SHA}"

      - name: 校验产物
        run: |
          set -e
          ls -l dist
          for f in dist/*.fpk; do
            echo "== $f"
            # 外层只应有 app.tgz + cmd/ + config/ + wizard/ + ICON + manifest
            tar -tzf "$f" | grep -qx 'manifest' || { echo "::error::$f 缺 manifest"; exit 1; }
            tar -tzf "$f" | grep -qx 'app.tgz'  || { echo "::error::$f 缺 app.tgz"; exit 1; }
            tar -tzf "$f" | grep -qx 'cmd/main' || { echo "::error::$f 缺 cmd/main"; exit 1; }

            # fnOS 读的是 manifest 里的 checksum 字段，必须等于 app.tgz 的 md5
            cs="$(tar -xzOf "$f" manifest | awk -F= '/^checksum/{gsub(/[ \t\r]/,"",$2);print $2}')"
            [ -n "$cs" ] || { echo "::error::$f 的 manifest 缺 checksum 字段（安装会报数据包不完整）"; exit 1; }
            got="$(tar -xzOf "$f" app.tgz | md5sum | awk '{print $1}')"
            [ "$cs" = "$got" ] || { echo "::error::$f checksum 不匹配：manifest=$cs app.tgz=$got"; exit 1; }
            echo "   checksum ok: $cs"

            tar -xzOf "$f" app.tgz | tar -tzf - | grep -qx 'app/run.py' \
              || { echo "::error::$f 内 app.tgz 缺 app/run.py"; exit 1; }
            tar -xzOf "$f" app.tgz | tar -tzf - | grep -qx 'ui/config' \
              || { echo "::error::$f 内缺 ui/config（桌面入口）"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/*.fpk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  # 发布后自检：确认 release 资产与源码包都在（内部更新走的就是源码包这条链路）
  verify-release:
    needs: [build, meta]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 校验 release 资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" -o rel.json
          python3 -c '
          import json
          d = json.load(open("rel.json"))
          names = [a["name"] for a in d.get("assets", [])]
          print("assets:", names)
          assert any(n.endswith(".fpk") for n in names), "release 没有 fpk 资产"
          '
          echo "内部更新源码包：$API/tarball/$TAG"
